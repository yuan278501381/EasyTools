name: EasyTools CI/CD

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch: # 允许在 GitHub 网页上手动触发

jobs:
  build-and-deploy:
    name: Build EasyTools (Windows x64)
    runs-on: windows-latest

    permissions:
      id-token: write
      contents: read
      attestations: write

    env:
      # 世界级双轨加速架构: vcpkg x-gha 与本地 AppData 二进制归档互补，结合 sccache 编译器级命中
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - name: 检出代码 (Checkout Code)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 导出 vcpkg 缓存后端变量 (Export vcpkg cache env)
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: 配置 Sccache 编译器级极速缓存 (Setup Sccache)
        uses: mozilla/sccache-action@v0.0.9
        with:
          version: "v0.8.2"

      - name: 配置 Node.js 环境 (Setup Node.js)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'ui/package-lock.json'

      - name: 配置 Vcpkg 二进制归档缓存 (Setup Vcpkg Binary Archives Cache)
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\AppData\Local\vcpkg\archives
            C:\vcpkg\installed
            C:\vcpkg\downloads
            C:\vcpkg\packages
            build\vcpkg_installed
          key: ${{ runner.os }}-vcpkg-archives-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-archives-
            ${{ runner.os }}-vcpkg-

      - name: 安装 Inno Setup (Install Inno Setup)
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: 执行一键幂等部署流水线 (Run Deployment Script)
        shell: pwsh
        run: |
          .\deploy.ps1 -Configuration Release

      - name: 统计 Sccache 命中率 (Show Sccache Stats)
        shell: pwsh
        if: always()
        run: |
          if (Get-Command "sccache" -ErrorAction SilentlyContinue) {
            sccache --show-stats
          }

      - name: 上传构建产物 (Upload Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: EasyTools-Release-x64
          path: |
            deploy_dist/
            Output/EasyTools-Setup.exe
          if-no-files-found: error
          retention-days: 7

      - name: 生成安全构建溯源证明 (Attest Build Provenance)
        uses: actions/attest-build-provenance@v4.1.0
        with:
          subject-path: 'deploy_dist/**'
