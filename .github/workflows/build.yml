name: EasyTools CI/CD

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch: # 允许在 GitHub 网页上手动触发

jobs:
  build-and-deploy:
    name: Build EasyTools (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 35

    permissions:
      id-token: write
      contents: write       # 允许自动创建和发布 GitHub Releases
      attestations: write

    env:
      # 世界级双轨加速架构: vcpkg x-gha 与本地 AppData 二进制归档互补，结合 sccache 编译器级命中
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
      SCCACHE_GHA_ENABLED: "true"

    steps:
      - name: 检出代码 (Checkout Code)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 导出 vcpkg 缓存后端变量 (Export vcpkg cache env)
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: 配置 Sccache 编译器级极速缓存 (Setup Sccache)
        uses: mozilla/sccache-action@v0.0.9
        with:
          version: "v0.8.2"

      - name: 配置 Node.js 环境 (Setup Node.js)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'ui/package-lock.json'

      - name: 配置 Vcpkg 二进制归档缓存 (Setup Vcpkg Binary Archives Cache)
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\AppData\Local\vcpkg\archives
            C:\vcpkg\installed
            C:\vcpkg\downloads
            C:\vcpkg\packages
            build\vcpkg_installed
          key: ${{ runner.os }}-vcpkg-archives-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-archives-
            ${{ runner.os }}-vcpkg-

      - name: 安装打包与覆盖率工具 (Install Inno Setup & OpenCppCoverage)
        shell: pwsh
        run: choco install innosetup opencppcoverage --yes --no-progress

      - name: 执行一键幂等部署流水线 (Run Deployment Script with Coverage)
        shell: pwsh
        run: |
          .\deploy.ps1 -Configuration Release -Coverage

      - name: 统计 Sccache 命中率 (Show Sccache Stats)
        shell: pwsh
        if: always()
        run: |
          if (Get-Command "sccache" -ErrorAction SilentlyContinue) {
            sccache --show-stats
          }

      - name: 归档代码覆盖率报告 (Upload Code Coverage Report)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: EasyTools-CodeCoverage-Report
          path: coverage_report/
          if-no-files-found: warn
          retention-days: 14

      - name: 上传构建产物 (Upload Build Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: EasyTools-Release-x64
          path: |
            deploy_dist/
            Output/EasyTools-Setup.exe
          if-no-files-found: error
          retention-days: 7

      - name: 生成安全构建溯源证明 (Attest Build Provenance)
        uses: actions/attest-build-provenance@v4.1.0
        with:
          subject-path: 'deploy_dist/**'

      - name: 准备发行版资产 (Prepare Release Assets)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ReleaseDir = "release_assets"
          if (Test-Path $ReleaseDir) { Remove-Item -Recurse -Force $ReleaseDir }
          New-Item -ItemType Directory -Path $ReleaseDir | Out-Null

          $Tag = "${{ github.ref_name }}"
          # 1. 复制并重命名安装包
          Copy-Item "Output\EasyTools-Setup.exe" "$ReleaseDir\EasyTools-$Tag-Setup.exe"

          # 2. 打包便携免安装 ZIP
          $TempPortable = Join-Path $env:TEMP "EasyTools-$Tag"
          if (Test-Path $TempPortable) { Remove-Item -Recurse -Force $TempPortable }
          Copy-Item -Recurse "deploy_dist" $TempPortable
          Compress-Archive -Path $TempPortable -DestinationPath "$ReleaseDir\EasyTools-$Tag-win-x64-portable.zip" -CompressionLevel Optimal
          Remove-Item -Recurse -Force $TempPortable

          # 3. 计算 SHA256 校验和
          $Checksums = @()
          Get-ChildItem -Path $ReleaseDir -File | ForEach-Object {
              $Hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLower()
              $Checksums += "$Hash  $($_.Name)"
          }
          $Checksums | Out-File -FilePath "$ReleaseDir\SHA256SUMS.txt" -Encoding utf8

      - name: 自动发布到 GitHub Releases (Auto-Publish to GitHub Releases)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: EasyTools ${{ github.ref_name }} (Windows x64)
          files: |
            release_assets/EasyTools-*-Setup.exe
            release_assets/EasyTools-*-win-x64-portable.zip
            release_assets/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
