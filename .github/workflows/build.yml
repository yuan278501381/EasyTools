name: EasyTools CI/CD

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch: # 允许在 GitHub 网页上手动触发

jobs:
  build-and-deploy:
    name: Build EasyTools (Windows x64)
    runs-on: windows-latest
    
    # 世界级项目安全要求：为构建溯源证明授予必要权限
    permissions:
      id-token: write
      contents: read
      attestations: write

    # vcpkg 二进制缓存: 用 GitHub Actions Cache 作为后端, 按「每个依赖包的 ABI 哈希」
    # 缓存编译产物。即使 vcpkg.json 改动, 未受影响的依赖(OpenCV/FFmpeg 等)仍可秒级还原,
    # 避免整包从源码重编。与下方 actions/cache(缓存已安装树, 命中时直接跳过)互补。
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - name: 检出代码 (Checkout Code)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # vcpkg 的 x-gha 二进制缓存后端需要这两个变量, 由本步骤从 runner 环境导出给后续步骤
      - name: 导出 vcpkg 缓存后端变量 (Export vcpkg cache env)
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: 配置 Node.js 环境 (Setup Node.js)
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'ui/package-lock.json'

      - name: 配置 Vcpkg 二进制缓存 (Setup Vcpkg Cache)
        # 世界级工程必备：利用 GitHub Actions 的原生缓存来缓存 OpenCV/FFmpeg 等耗时巨大的 C++ 库
        uses: actions/cache@v4
        with:
          path: |
            C:\vcpkg\installed
            C:\vcpkg\downloads
            C:\vcpkg\packages
            build\vcpkg_installed
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: 执行一键幂等部署流水线 (Run Deployment Script)
        shell: pwsh
        run: |
          # 调用我们编写的幂等脚本
          # GitHub runner 已经内置了 CMake 和 MSVC，脚本会顺利接力通过
          .\deploy.ps1 -Configuration Release

      - name: 上传构建产物 (Upload Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: EasyTools-Release-x64
          path: deploy_dist/
          if-no-files-found: error
          retention-days: 7

      - name: 生成安全构建溯源证明 (Attest Build Provenance)
        # 为生成的产物签发带有加密防伪校验的 SBOM / SLSA 来源证明
        uses: actions/attest-build-provenance@v4.1.0
        with:
          subject-path: 'deploy_dist/**'
