<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="easytools-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4378F0" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="easytools-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#easytools-grad)" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />
  <!-- Flat Aero Speed Bolt -->
  <polygon points="56.8,12 82.4,12 66.4,56 92,56 46.8,116 60.8,76 34.4,76" fill="#FFFFFF" filter="url(#easytools-shadow)" />
</svg>